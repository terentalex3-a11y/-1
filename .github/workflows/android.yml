name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "build-tools;36.1.0" "platforms;android-36"

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Build APK
        run: mkdir -p build && godot --headless --path . --export-debug "Android" build/PostApocalypseRPG.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostApocalypseRPG-APK
          path: build/PostApocalypseRPG.apk
          if-no-files-found: error
